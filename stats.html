<style>
:root{
  --ink:#14213d; --ink-2:#2b3a5c; --paper:#f7f3ea; --card:#fffdf8; --line:#e4dccb;
  --gold:#b8873b; --gold-2:#e9d3a6; --muted:#6c6a63; --r:14px;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.07);
  /* chart roles – categorical slots validated against #fffdf8 (adjacent CVD ΔE ≥ 11.8) */
  --s1:#257de0; --s2:#f47230; --s3:#00b894; --s4:#f2a600; --s5:#ee7fac; --s6:#008a17; --s7:#6a4ce2; --s-unk:#c9c3b6;
  --grid:#ece5d6; --axis:#8a867c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Heebo,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55}
:lang(ru) body{font-family:Rubik,Heebo,"Segoe UI",Arial,sans-serif}
:lang(ru) h1,:lang(ru) h2,:lang(ru) .kpi b{font-family:"PT Serif","Frank Ruhl Libre",serif}
a{color:var(--ink-2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{background:radial-gradient(1200px 400px at 85% -10%,#2b3a5c 0,transparent 60%),var(--ink);color:#f7f3ea;padding:30px 0 96px;position:relative}
header:after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.08em;color:var(--gold-2);text-transform:uppercase}
.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid rgba(233,211,166,.25)}
.tabs a{color:#d7d2c4;text-decoration:none;font-size:15px;padding:9px 18px 10px;border-radius:10px 10px 0 0;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
.tabs a[aria-current=page]{color:var(--ink);background:var(--paper);border-color:rgba(233,211,166,.35);font-weight:500}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:99px;padding:3px}
.langs button{font:inherit;font-size:13px;border:0;background:transparent;color:#d7d2c4;padding:5px 12px;border-radius:99px;cursor:pointer}
.langs button.on{background:#f7f3ea;color:var(--ink);font-weight:500}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(32px,4.6vw,52px);line-height:1.05;margin:26px 0 10px}
h1 em{font-style:normal;color:var(--gold-2)}
.lede{max-width:700px;color:#d7d2c4;font-weight:300;font-size:18px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-62px;position:relative}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.kpi b{display:block;font-family:"Frank Ruhl Libre",serif;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 16px;margin:22px 0}
h2{font-family:"Frank Ruhl Libre",serif;font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:780px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin:0 0 10px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.legend.lines i{height:3px;width:16px;border-radius:2px}
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;fill:var(--muted);font-size:11px}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:500}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;line-height:1.45;min-width:170px;opacity:0;transition:opacity .08s;z-index:5;color:var(--ink)}
.tip b{display:block;font-size:13px;margin-bottom:3px}
.tip div{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tip div span{display:flex;gap:6px;align-items:center}
.tip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tip .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:500}
.tblbtn{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--ink-2);margin-top:10px}
.tblwrap{overflow:auto;max-height:460px;margin-top:10px;display:none;border:1px solid var(--line);border-radius:10px}
.tblwrap.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:#f4efe3;position:sticky;top:0;font-weight:500}
td.n,th.n{text-align:end}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.grid2 .card{margin:0;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--s1);display:inline-block;vertical-align:middle}
tr.grp td{font-weight:500;background:#faf6ec}
tr.subrow td:first-child{padding-inline-start:26px;color:var(--muted)}
.method p{font-size:14.5px;margin:0 0 10px;max-width:900px}
.method .src{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:13px;padding:10px 0 40px}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.chart{overflow-x:auto}.chart svg{width:760px;max-width:none}#tblC td:first-child,#tblD td:first-child{white-space:normal}.card{padding:16px 14px 12px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="15" cy="20" r="10" stroke="#e9d3a6" stroke-width="2.4"/><circle cx="25" cy="20" r="10" stroke="#b8873b" stroke-width="2.4"/></svg>
        NYC Marriage Index · 1950–2017
      </div>
      <nav class="langs" aria-label="Language">
        <button type="button" data-lang="he" lang="he">עברית</button>

        <button type="button" data-lang="fr" lang="fr">Français</button>
        <button type="button" data-lang="ru" lang="ru">Русский</button>

    </div>
    <nav class="tabs" data-i18n-aria="nav.aria">

  </div>
</header>

<main class="wrap">
  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2 data-i18n="b.h"></h2>
    <p class="sub" data-i18n="b.sub"></p>
    <ul class="legend" id="legB"></ul>
    <div class="chart" id="chartB"></div>
    <button class="tblbtn" data-t="tblB" data-i18n="tbl.show"></button>
    <div class="tblwrap" id="tblB"></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2 data-i18n="c.h"></h2>
      <div class="tblwrap on" id="tblC" style="max-height:none;border:0"></div>
    </div>
    <div class="card">
      <h2 data-i18n="d.h"></h2>
      <div class="tblwrap on" id="tblD" style="max-height:none;border:0"></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="a.h"></h2>
    <p class="sub" data-i18n="a.sub"></p>
    <ul class="legend lines" id="legA"></ul>
    <div class="chart" id="chartA"></div>
    <button class="tblbtn" data-t="tblA" data-i18n="tbl.show"></button>
    <div class="tblwrap" id="tblA"></div>
  </section>

  <section class="card method">
    <h2 data-i18n="m.h"></h2>
    <p data-i18n="m.p1"></p>
    <p data-i18n="m.p2"></p>
    <p data-i18n="m.p3"></p>
    <p class="src" data-i18n="m.src"></p>
  </section>
  <footer><a href="https://www.linkedin.com/in/amitay-dan-a63647aa" target="_blank" rel="noopener">Amitay Dan</a> · <a href="https://www.reclaimtherecords.org/" target="_blank" rel="noopener">Reclaim The Records</a></footer>
