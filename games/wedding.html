<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>מחבואים בחתונה</title>
<meta name="description" content="Wedding Hide & Seek — a small blocky 3D mini-game: the bride and groom hide from each other among the wedding guests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;500;700&family=PT+Serif:wght@700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f7f3ea;--gold:#b8873b;--gold2:#e9d3a6;--line:#e4dccb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;font-family:Heebo,"Segoe UI",Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(20,33,61,.35);backdrop-filter:blur(2px);overflow:auto}
.panel[hidden]{display:none}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 rgba(20,33,61,.55);max-width:560px;width:100%;padding:22px;image-rendering:pixelated}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(28px,6vw,40px);margin:0 0 6px;line-height:1.05}
.sub{margin:0 0 16px;color:#4b4a45;font-size:15px}
.lbl{font-size:13px;color:#6c6a63;margin:14px 0 6px;font-weight:500}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{font:inherit;font-weight:700;font-size:17px;border:3px solid var(--line);background:#fff;border-radius:6px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.pick canvas{width:84px;height:108px;image-rendering:pixelated}
.pick.on{border-color:var(--ink);background:#fff8e6;box-shadow:3px 3px 0 var(--gold)}
#story{min-height:22px;font-size:14px;margin:10px 0 0;color:var(--ink)}
.diffs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diff{font:inherit;border:2px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;cursor:pointer;text-align:start;color:var(--ink)}
.diff b{display:block;font-size:15px}.diff span{font-size:12px;color:#6c6a63}
.diff.on{border-color:var(--ink);background:#eef3fb}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:18px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);border-radius:6px;padding:10px 26px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;font-size:15px;padding:8px 16px}
.small{font-size:12.5px;color:#6c6a63;margin-top:12px}
a.back{color:var(--ink);font-size:14px}
#langs{display:flex;gap:4px;flex-wrap:wrap}
#langs button,#sound,#music{font:inherit;font-size:12px;border:2px solid var(--line);background:#fff;border-radius:4px;padding:3px 8px;cursor:pointer;color:var(--ink)}
#langs button.on{border-color:var(--ink);background:var(--ink);color:#fff}
#sound.off,#music.off,#musicHud.off{text-decoration:line-through;opacity:.6}
/* HUD */
#hud[hidden]{display:none}
.hudbar{position:fixed;top:10px;inset-inline:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.chip{pointer-events:auto;background:rgba(20,33,61,.82);color:#fff;border-radius:6px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid rgba(255,255,255,.25)}
#menuBtn{font:inherit;cursor:pointer}
#heat{min-width:160px}
#heat .bar{height:8px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;margin-top:4px}
#heatFill{height:100%;width:0;transition:width .3s,background .3s}
#heatLbl{font-size:13px}
#msg{position:fixed;top:64px;left:50%;transform:translate(-50%,-10px);background:rgba(255,248,230,.96);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:8px 14px;font-size:15px;max-width:min(560px,92vw);text-align:center;opacity:0;transition:.3s;pointer-events:none}
#msg.on{opacity:1;transform:translate(-50%,0)}
.cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;opacity:.7}
.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.cross:before{left:6px;top:0;width:2px;height:14px}.cross:after{top:6px;left:0;height:2px;width:14px}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(20,33,61,.25);border:2px solid rgba(255,255,255,.5);pointer-events:none;opacity:0;left:30px;bottom:30px}
#joy.on{opacity:1}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.8);border:2px solid var(--ink)}
/* win */
:lang(ru) body{font-family:Rubik,Heebo,"Segoe UI",Arial,sans-serif}
:lang(ru) h1{font-family:"PT Serif",serif}
#win .card{text-align:center}
#win h1{font-size:clamp(40px,10vw,64px);color:var(--gold)}
#winText{font-size:18px;margin:6px 0}
#winBest{font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="panel" id="menu">
  <div class="card">
    <div class="row" style="margin-top:0">
      <div id="langs"></div>
      <span style="display:flex;gap:4px"><button id="music" data-t="music"></button><button id="sound" data-t="sound"></button></span>
    </div>
    <h1 data-t="title" style="margin-top:12px"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="lbl" data-t="choose"></div>
    <div class="picks">
      <button class="pick" data-role="bride"><canvas width="84" height="108" data-role="bride"></canvas><span data-t="bride"></span></button>
      <button class="pick" data-role="groom"><canvas width="84" height="108" data-role="groom"></canvas><span data-t="groom"></span></button>
    </div>
    <p id="story"></p>
    <div class="diffs">
      <button class="diff" data-d="easy"><b data-t="easy"></b><span data-t="easyD"></span></button>
      <button class="diff" data-d="hard"><b data-t="hard"></b><span data-t="hardD"></span></button>
    </div>
    <div class="row">
      <a class="back" id="backLink" href="../index.html" data-t="home"></a>
      <button class="btn" id="startBtn" disabled data-t="start"></button>
    </div>
    <div class="small" id="ctrl"></div>
    <div class="small" data-t="musicNote"></div>
  </div>
</div>

<div id="hud" hidden>
  <div class="hudbar">
    <span style="display:flex;gap:6px"><button class="chip" id="menuBtn" data-t="menu"></button><button class="chip" id="musicHud" title="♪">♪</button></span>
    <div class="chip" id="time">0:00</div>
    <div class="chip" id="heat"><span id="heatLbl"></span><div class="bar"><div id="heatFill"></div></div></div>
  </div>
  <div class="cross"></div>
  <div id="msg"></div>
  <div id="joy" hidden><div id="knob"></div></div>
</div>

<div class="panel" id="win" hidden>
  <div class="card">
    <h1 data-t="win"></h1>
    <p id="winText"></p>
    <p id="winBest"></p>
    <div class="row" style="justify-content:center">
      <button class="btn" id="againBtn" data-t="again"></button>
      <a class="btn ghost" id="backLink2" href="../index.html" data-t="back" style="text-decoration:none"></a>
    </div>
  </div>
</div>

<noscript>JavaScript / WebGL required.</noscript>
<script type="module" src="wedding.js"></script>
</body>
</html>
