<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="חיפוש בעברית, באנגלית, ביידיש ובצרפתית ב־4.7 מיליון רישיונות נישואים של ניו יורק 1950–2017 (NYC Marriage Index, Reclaim The Records).">
<meta property="og:title" content="אינדקס הנישואים של ניו יורק · NYC Marriage Index 1950–2017">
<meta property="og:description" content="Search 4.7M New York City marriage licenses in Hebrew, English, Yiddish or French. Data: Reclaim The Records (public domain).">
<meta property="og:type" content="website">
<meta name="author" content="Amitay Dan">
<title>אינדקס הנישואים של ניו יורק · 1950–2017</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d; --ink-2:#2b3a5c; --paper:#f7f3ea; --card:#fffdf8; --line:#e4dccb;
  --gold:#b8873b; --gold-2:#e9d3a6; --muted:#6c6a63; --ok:#2f7d5b; --hl:#fff1cc;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.07);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Heebo,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5}
a{color:var(--ink-2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* hero */
header{background:radial-gradient(1200px 400px at 85% -10%,#2b3a5c 0,transparent 60%),var(--ink);color:#f7f3ea;padding:44px 0 120px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.brand{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.08em;color:var(--gold-2);text-transform:uppercase}
.brand svg{flex:none}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(34px,5vw,56px);line-height:1.05;margin:14px 0 10px}
h1 em{font-style:normal;color:var(--gold-2)}
.lede{max-width:640px;color:#d7d2c4;font-weight:300;font-size:18px;margin:0}
.stats{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
.stat b{display:block;font-family:"Frank Ruhl Libre",serif;font-size:28px;color:#fff;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:#aeb5c6}

/* search card */
.search{margin-top:-86px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px;position:relative}
.people{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:end}
.person h3{margin:0 0 10px;font-size:14px;font-weight:500;color:var(--muted);display:flex;gap:8px;align-items:center}
.person h3 i{font-style:normal;background:var(--ink);color:#fff;border-radius:99px;width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px}
.person.b h3 i{background:var(--gold)}
.row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.amp{font-family:"Frank Ruhl Libre",serif;font-size:34px;color:var(--gold);padding-bottom:6px}
label.f{display:block}
label.f span{display:block;font-size:12px;color:var(--muted);margin:0 2px 4px}
input[type=text],input[type=number],select{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px rgba(43,58,92,.12)}
input.latin{direction:ltr;text-align:right}
input::placeholder{color:#aaa49a}
.opts{display:flex;gap:18px;flex-wrap:wrap;align-items:end;margin-top:20px;padding-top:20px;border-top:1px dashed var(--line)}
.seg{display:inline-flex;background:#f1ece1;border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:500}
.years{display:flex;gap:6px;align-items:center}
.years input{width:92px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.go{margin-inline-start:auto;display:flex;gap:8px}
.btn{font:inherit;font-weight:500;border:0;border-radius:10px;padding:12px 26px;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:#f1ece1}
.hint{font-size:13px;color:var(--muted);margin-top:12px}
.hint code{background:#f1ece1;border-radius:5px;padding:1px 6px;direction:ltr;display:inline-block}
details.adv{margin-top:6px}
details.adv summary{cursor:pointer;font-size:13px;color:var(--ink-2);list-style:none}
details.adv summary::-webkit-details-marker{display:none}

/* free search */
.free{display:flex;gap:10px}
.free input{font-size:19px;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line)}
.free input:focus{border-color:var(--ink)}
.free .btn{padding:0 30px;font-size:17px;border-radius:14px}
.ex{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.ex button{font:inherit;font-size:13px;background:#f1ece1;border:0;border-radius:99px;padding:5px 11px;cursor:pointer;color:var(--ink-2)}
.ex button:hover{background:var(--gold-2)}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--ink-2);cursor:pointer;padding:0;margin-top:14px;text-decoration:underline;text-underline-offset:3px}
#detailed{margin-top:18px;padding-top:20px;border-top:1px dashed var(--line)}
.parsed{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:-4px 0 12px}
.parsed b{font-weight:500;background:#e7ecf6;color:var(--ink-2);border-radius:99px;padding:2px 10px}
.notice{background:#fff8e6;border:1px solid #f0dcaa;color:#6b5418;border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 12px}
.ffilter{display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:#fff;border-radius:99px;padding:3px 6px 3px 12px;font-size:13px;direction:ltr}
.ffilter button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:99px;width:20px;height:20px;cursor:pointer}

/* results */
.bar{display:flex;align-items:center;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.bar h2{font-family:"Frank Ruhl Libre",serif;font-size:24px;margin:0}
.bar .count{color:var(--muted)}
.bar .sp{flex:1}
.bar select{width:auto;padding:8px 12px}
.vars{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 12px;display:grid;gap:8px}
.vrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vrow .lbl{font-size:13px;color:var(--muted);min-width:130px}
.vchip{font:inherit;font-size:12.5px;direction:ltr;border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;cursor:pointer;color:var(--ink)}
.vchip i{font-style:normal;color:var(--muted);margin-left:5px;font-size:11px}
.vchip:hover{border-color:var(--ink-2);background:#f1ece1}
.vchip.far{opacity:.6}
.vchip.on{background:var(--ink);border-color:var(--ink);color:#fff;opacity:1}
.vchip.on i{color:var(--gold-2)}
.fand{font-weight:700;color:var(--gold);margin:0 4px}
.fgroup{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px dashed var(--line);border-radius:99px;padding:2px}
.for{color:var(--muted);margin:0 2px}
.vnote{font-size:12px;color:var(--muted)}
.list{display:grid;gap:10px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:86px 1fr auto;gap:18px;align-items:center;transition:transform .12s,box-shadow .12s}
.rec:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.yr{font-family:"Frank Ruhl Libre",serif;font-size:30px;font-weight:700;text-align:center;line-height:1;color:var(--ink)}
.yr small{display:block;font-family:Heebo;font-size:12px;font-weight:400;color:var(--muted);margin-top:6px;direction:ltr}
.couple{display:flex;gap:14px;align-items:center;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.nm{font-size:17px}
.nm .ln{font-weight:700;letter-spacing:.02em}
.nm .fn{color:var(--ink-2)}
.nm.hit{background:var(--hl);border-radius:6px;padding:1px 6px;margin:-1px -6px}
.heart{color:var(--gold);font-size:14px}
.metaline{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.tag{font-size:12px;border-radius:99px;padding:3px 10px;background:#f1ece1;color:var(--ink-2)}
.tag.boro{background:#e7ecf6}
.tag.lic{direction:ltr;font-variant-numeric:tabular-nums;background:#fff;border:1px solid var(--line)}
.acts{display:flex;flex-direction:column;gap:6px}
.icon{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon:hover{background:#f1ece1}
.extra{grid-column:1/-1;font-size:12px;color:var(--muted);direction:ltr;text-align:right;border-top:1px dashed var(--line);padding-top:8px;display:none}
.rec.open .extra{display:block}
.pager{display:flex;gap:6px;justify-content:center;margin:22px 0 40px}
.pager button{font:inherit;min-width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
.pager button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-family:"Frank Ruhl Libre",serif;font-size:26px;color:var(--ink);margin-bottom:6px}
.err{background:#fff1f0;border:1px solid #f3c4bf;color:#8a2a1f;border-radius:10px;padding:12px 16px;margin-top:20px}
.skel{height:86px;border-radius:var(--r);background:linear-gradient(90deg,#efe9dc 0,#f8f4ec 50%,#efe9dc 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* about */
.about{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:40px 0}
.about div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.about h4{margin:0 0 6px;font-family:"Frank Ruhl Libre",serif;font-size:18px}
.about p{margin:0;font-size:14px;color:var(--muted)}
footer{color:var(--muted);font-size:13px;padding:24px 0 40px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}


/* header bar + languages */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:99px;padding:3px}
.langs button{font:inherit;font-size:13px;border:0;background:transparent;color:#d7d2c4;padding:5px 12px;border-radius:99px;cursor:pointer}
.langs button.on{background:#f7f3ea;color:var(--ink);font-weight:500}
.langs button:hover:not(.on){color:#fff}
.help{font-size:13px;color:var(--muted);margin-top:10px}
/* mini games */
.games{margin:30px 0 0}
.games h4{font-family:"Frank Ruhl Libre",serif;font-size:22px;margin:0 0 10px}
.game-card{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,#1f3a5c,#14213d);color:#f7f3ea;border-radius:var(--r);padding:16px 18px;text-decoration:none;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--gold);transition:transform .12s,box-shadow .12s}
.game-card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--gold)}
.game-art{width:168px;height:96px;image-rendering:pixelated;border-radius:4px;background:#9fd3ff}
.game-txt b{font-family:"Frank Ruhl Libre",serif;font-size:22px;display:block}
.game-txt p{margin:4px 0;font-size:14px;color:#d7d2c4}
.game-note{font-size:12px;color:var(--gold-2)}
.game-play{background:var(--gold);color:var(--ink);font-weight:700;border-radius:6px;padding:10px 18px;border:2px solid #f7f3ea;white-space:nowrap}

/* sources + footer */
.sources{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 30px}
.sources h4{margin:0 0 8px;font-family:"Frank Ruhl Libre",serif;font-size:18px}
.sources ul{margin:0;padding-inline-start:20px;font-size:14px;line-height:1.9}
.sources .note{font-size:13px;color:var(--muted);margin:10px 0 0}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.credit{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:500}
.credit .li{display:inline-flex;gap:6px;align-items:center;background:#0a66c2;color:#fff;text-decoration:none;font-size:13px;padding:5px 11px;border-radius:99px}
.credit .li:hover{background:#004182}
.privacy{font-size:13px}
/* direction-aware tweaks */
[dir=ltr] .couple{justify-content:flex-start}
.metaline{justify-content:flex-start !important}
[dir=ltr] input.latin{text-align:left}
[dir=ltr] .vrow .lbl{min-width:150px}

/* music player */
.music{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:50;display:flex;align-items:center;gap:8px;background:var(--ink);color:#f7f3ea;border-radius:99px;padding:6px;box-shadow:0 6px 24px rgba(20,33,61,.25);max-width:min(420px,calc(100vw - 32px))}
.music[hidden]{display:none}
.music button{border:0;cursor:pointer;display:grid;place-items:center;border-radius:99px;color:inherit}
.music .m-toggle{width:40px;height:40px;background:rgba(255,255,255,.12);flex:none}
.music .m-toggle:hover{background:rgba(255,255,255,.2)}
.music .m-next{width:32px;height:32px;background:transparent;opacity:.8;flex:none}
.music .m-next:hover{opacity:1}
[dir=rtl] .music .m-next svg{transform:scaleX(-1)}
.music .i-on{display:none}.music.on .i-on{display:block}.music.on .i-off{display:none}
.music.on .m-toggle{background:var(--gold);color:var(--ink)}
.music .m-info{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-inline-end:4px}
.music .m-title{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .m-credit{font-size:11px;color:var(--gold-2);text-decoration:none;opacity:.85}
.music .m-credit:hover{text-decoration:underline}
.music:not(.on) .m-info,.music:not(.on) .m-next{display:none}
body{padding-bottom:70px}

@media (max-width:820px){
  .game-card{grid-template-columns:1fr;text-align:start}.game-art{width:100%;height:auto;aspect-ratio:168/96}.game-play{justify-self:start}
  .free .btn{padding:0 18px}.free .btn .t{display:none}.free input{font-size:17px;padding:14px}
  .people{grid-template-columns:1fr}.amp{display:none}
  .rec{grid-template-columns:64px 1fr;}.acts{grid-column:1/-1;flex-direction:row;justify-content:flex-end}
  .yr{font-size:24px}.about{grid-template-columns:1fr}.go{margin-inline-start:0;width:100%}.go .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="15" cy="20" r="10" stroke="#e9d3a6" stroke-width="2.4"/><circle cx="25" cy="20" r="10" stroke="#b8873b" stroke-width="2.4"/></svg>
        NYC Marriage Index · 1950–2017
      </div>
      <nav class="langs" aria-label="Language">
        <button type="button" data-lang="he" lang="he">עברית</button>
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="yi" lang="yi">ייִדיש</button>
        <button type="button" data-lang="fr" lang="fr">Français</button>
      </nav>
    </div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <form class="search" id="f" autocomplete="off">
    <div class="free">
      <input type="text" id="qfree" data-i18n-ph="free.ph" data-i18n-aria="free.ph" autofocus>
      <button class="btn" type="submit" id="goFree">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="t" data-i18n="search"></span>
      </button>
    </div>
    <div class="ex"><span data-i18n="try"></span><span id="examples" class="ex"></span></div>
    <div class="help" data-i18n="free.help"></div>
    <button type="button" class="linkbtn" id="toggleAdv" data-i18n="adv.open"></button>
    <div id="detailed" hidden>
    <div class="people">
      <div class="person a">
        <h3><i>1</i> <span data-i18n="p.a"></span></h3>
        <div class="row">
          <label class="f"><span data-i18n="f.last"></span><input type="text" name="a_last" placeholder="Cohen · כהן"></label>
          <label class="f"><span data-i18n="f.first"></span><input type="text" name="a_first" placeholder="Sarah · שרה"></label>
        </div>
      </div>
      <div class="amp">&amp;</div>
      <div class="person b">
        <h3><i>2</i> <span data-i18n="p.b"></span> <small style="font-weight:300" data-i18n="optional"></small></h3>
        <div class="row">
          <label class="f"><span data-i18n="f.last"></span><input type="text" name="b_last" placeholder="Levy · לוי"></label>
          <label class="f"><span data-i18n="f.first"></span><input type="text" name="b_first" placeholder="David · דוד"></label>
        </div>
      </div>
    </div>

    <div class="opts">
      <div>
        <label class="f"><span data-i18n="match"></span></label>
        <div class="seg" id="mode">
          <button type="button" data-v="phonetic" class="on" title="Cohen = Kohn = Cahn = כהן" data-i18n="m.phon"></button>
          <button type="button" data-v="prefix" title="Gold → Goldberg, Goldstein" data-i18n="m.pre"></button>
          <button type="button" data-v="exact" data-i18n="m.exact"></button>
        </div>
      </div>
      <div>
        <label class="f"><span data-i18n="years"></span></label>
        <div class="years" dir="ltr">
          <input type="number" name="year_from" min="1950" max="2017" placeholder="1950">
          <span>–</span>
          <input type="number" name="year_to" min="1950" max="2017" placeholder="2017">
        </div>
      </div>
      <div>
        <label class="f"><span data-i18n="boro"></span></label>
        <div class="chips" id="boros"></div>
      </div>
      <div class="go">
        <button type="button" class="btn ghost" id="reset" data-i18n="reset"></button>
        <button class="btn" type="submit" id="goDet">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span data-i18n="search"></span>
        </button>
      </div>
    </div>
    <details class="adv">
      <summary data-i18n="more"></summary>
      <div class="opts" style="border:0;padding-top:12px;margin-top:0">
        <label class="f" style="width:220px"><span data-i18n="license"></span><input type="text" name="license" class="latin" placeholder="12345" dir="ltr"></label>
      </div>
    </details>
    <div class="hint" data-i18n="hint"></div>
    </div>
  </form>

  <div id="out"></div>

  <section class="games" id="games">
    <h4 data-i18n="games.h"></h4>
    <a class="game-card" id="gameLink" href="games/wedding.html">
      <canvas class="game-art" width="168" height="96" aria-hidden="true"></canvas>
      <div class="game-txt">
        <b data-i18n="games.t"></b>
        <p data-i18n="games.p"></p>
        <span class="game-note" data-i18n="games.note"></span>
      </div>
      <span class="game-play" data-i18n="games.play"></span>
    </a>
  </section>

  <section class="about" id="about">
    <div><h4 data-i18n="about1.h"></h4><p data-i18n="about1.p"></p></div>
    <div><h4 data-i18n="about2.h"></h4><p data-i18n="about2.p"></p></div>
    <div><h4 data-i18n="about3.h"></h4><p data-i18n="about3.p"></p></div>

  <section class="sources" id="sources">

    <ul>
      <li><a href="https://www.nycmarriageindex.com/" target="_blank" rel="noopener">The New York City Marriage Index (nycmarriageindex.com)</a> – <span data-i18n="src.site"></span></li>

        <a href="https://archive.org/details/nycmarriageindex_1950-1995_data_sql" target="_blank" rel="noopener" dir="ltr">NYC Marriage Index, 1950–1995 – SQL</a> ·
        <a href="https://archive.org/details/nycmarriageindex_1996-2017_data_sql" target="_blank" rel="noopener" dir="ltr">NYC Marriage Index, 1996–2017 – SQL</a></li>

<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script src="engine.js"></script>
<script src="music.js" defer></script>
<script>
const t = (k, v) => I18N.t(k, v);
const boroName = b => (t("boros") || {})[b] || b;
let META = null;
const PAGE = 50;
const $ = s => document.querySelector(s);
const f = $("#f"), out = $("#out");
const engine = new NYCEngine.Engine("data/");
let mode = "phonetic", boros = new Set(), page = 1, sort = "relevance", current = null, lastQ = null;
let kind = "free";
const filters = new Map();            // קבוצה (מילה / שדה) → קבוצת כתיבים נבחרים
const qfree = $("#qfree"), det = $("#detailed");

const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString(I18N.L[I18N.lang]._locale);
const errMsg = e => (I18N.L.he[e.message] ? t(e.message) : e.message) + (e.detail ? ` (${e.detail})` : "");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}

async function loadMeta(){
  try{
    META = await engine.init();
    paintDynamic();
    restore();
  }catch(e){ out.innerHTML = `<div class="err">${esc(t("E_META"))} ${esc(e.detail||"")}</div>` }
}

/** חלקים שנבנים ב־JS ותלויים בשפה */
function paintDynamic(){
  if (META) {
    const m = META;
    $("#stats").innerHTML = `
      <div class="stat"><b>${fmt(m.total)}</b><span>${t("stat.total")}</span></div>
      <div class="stat"><b dir="ltr">${m.min_year}–${m.max_year}</b><span>${t("stat.years")}</span></div>
      <div class="stat"><b>${(m.boroughs||[]).length}</b><span>${t("stat.boros")}</span></div>`;
    const list = (m.boroughs && m.boroughs.length) ? m.boroughs : Object.keys(t("boros"));
    $("#boros").innerHTML = list.map(b=>`<button type="button" class="chip ${boros.has(b)?"on":""}" data-v="${esc(b)}">${esc(boroName(b))}</button>`).join("");
    $("#boros").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{c.classList.toggle("on");c.classList.contains("on")?boros.add(c.dataset.v):boros.delete(c.dataset.v)});
  }
  $("#examples").innerHTML = t("examples").map(x => `<button type="button" dir="auto">${esc(x)}</button>`).join("");
  $("#examples").querySelectorAll("button").forEach(b => b.onclick = () => { qfree.value = b.textContent; kind = "free"; page = 1; filters.clear(); run(); });
  $("#toggleAdv").textContent = det.hidden ? t("adv.open") : t("adv.close");
}

function paintGameArt(){
  const cv = document.querySelector(".game-art"); if (!cv) return;
  const g = cv.getContext("2d"), W = 168, H = 96, px = 4;
  g.fillStyle = "#9fd3ff"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#5fa64a"; g.fillRect(0, 64, W, 32);
  g.fillStyle = "#3f8a36"; for (let x = 0; x < W; x += 8) g.fillRect(x, 56, 8, 8 + ((x / 8) % 2) * 4);
  // chuppah
  g.fillStyle = "#8a6239"; g.fillRect(64, 28, 4, 40); g.fillRect(100, 28, 4, 40);
  g.fillStyle = "#f8f6ef"; g.fillRect(58, 22, 52, 8); g.fillStyle = "#2c5aa0"; g.fillRect(58, 24, 52, 2);
  // groom behind a tree (peeking), bride with veil
  g.fillStyle = "#6b4a2b"; g.fillRect(20, 36, 10, 32); g.fillStyle = "#2f7d32"; g.fillRect(8, 16, 34, 24);
  const fig = (x, y, top, head, hair) => { g.fillStyle = hair; g.fillRect(x, y, 12, 4); g.fillStyle = head; g.fillRect(x, y + 4, 12, 8);
    g.fillStyle = "#2b2b2b"; g.fillRect(x + 2, y + 7, 2, 2); g.fillRect(x + 8, y + 7, 2, 2); g.fillStyle = top; g.fillRect(x - 2, y + 12, 16, 16); };
  // groom: bald, glasses, salt-and-pepper beard
  fig(30, 38, "#1c1f2b", "#e7b48f", "#e7b48f"); g.fillStyle = "#ffffff"; g.fillRect(32, 36, 8, 2);
  g.fillStyle = "#161616"; g.fillRect(30, 44, 12, 2); g.fillStyle = "#7d7771"; g.fillRect(30, 48, 12, 2);
  // bride: wavy auburn hair, turquoise necklace
  fig(132, 38, "#fbfaf6", "#f3d2be", "#7f3d2d"); g.fillStyle = "#e9eef5"; g.fillRect(128, 40, 4, 24); g.fillRect(146, 40, 4, 24);
  g.fillStyle = "#7f3d2d"; g.fillRect(130, 40, 2, 14); g.fillRect(144, 40, 2, 14); g.fillStyle = "#2bb3a0"; g.fillRect(134, 50, 8, 2);
  g.fillStyle = "#fbfaf6"; g.fillRect(126, 54, 26, 12);
  g.fillStyle = "#e2556f"; g.fillRect(150, 14, 4, 4); g.fillRect(156, 20, 4, 4); g.fillStyle = "#f5d76e"; g.fillRect(118, 10, 4, 4);
  g.fillStyle = "#14213d"; g.font = "bold 18px monospace"; g.fillText("?", 52, 50); g.fillText("?", 112, 50);
}
paintGameArt();
function syncGameLink(){ const a = $("#gameLink"); if (a) a.href = "games/wedding.html?lang=" + I18N.lang; }
syncGameLink();

function setLang(lang){
  I18N.set(lang);
  syncGameLink();
  paintDynamic();
  if (current) render(current);
  const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
I18N.set(I18N.lang);
paintDynamic();

$("#mode").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  $("#mode").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.v;
});

function params(){
  const p = new URLSearchParams();
  if (kind === "free") p.set("q", qfree.value.trim());
  else {
    for (const [k,v] of new FormData(f)) if (v.trim()) p.set(k, v.trim());
    p.set("mode", mode); if (boros.size) p.set("borough",[...boros].join(","));
  }
  if (page > 1) p.set("page", page); if (sort !== "relevance") p.set("sort", sort);
  return p;
}

function restore(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (![...p.keys()].length) return;
  page = +p.get("page")||1; sort = p.get("sort")||"relevance";
  if (p.has("q")) { kind = "free"; qfree.value = p.get("q"); run(false); return; }
  kind = "det"; det.hidden = false;
  for (const el of f.elements) if (el.name && p.has(el.name)) el.value = p.get(el.name);
  mode = p.get("mode")||"phonetic"; $("#mode").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===mode));
  (p.get("borough")||"").split(",").filter(Boolean).forEach(b=>{boros.add(b);const c=$(`.chip[data-v="${CSS.escape(b)}"]`);c&&c.classList.add("on")});
  page = +p.get("page")||1; sort = p.get("sort")||"relevance";
  run(false);
}

f.onsubmit = e => {
  e.preventDefault();
  const inDet = e.submitter && e.submitter.id === "goDet" || det.contains(document.activeElement);
  kind = inDet ? "det" : "free";
  if (kind === "free" && !qfree.value.trim()) { qfree.focus(); return; }
  page = 1; filters.clear(); run();
};
$("#toggleAdv").onclick = () => { det.hidden = !det.hidden; $("#toggleAdv").textContent = det.hidden ? t("adv.open") : t("adv.close"); };
$("#reset").onclick = () => { f.reset(); qfree.value = ""; filters.clear(); boros.clear(); document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); out.innerHTML=""; current=null; history.replaceState(null,"",location.pathname + location.search); };

const SORTERS = {
  relevance: (a,b) => a.score-b.score || (a.year??9999)-(b.year??9999),
  year: (a,b) => (a.year??9999)-(b.year??9999) || (a.date||"").localeCompare(b.date||""),
  year_desc: (a,b) => (b.year??0)-(a.year??0) || (b.date||"").localeCompare(a.date||""),
  name: (a,b) => (a.s1.last||"").localeCompare(b.s1.last||"") || (a.s1.first||"").localeCompare(b.s1.first||""),
};

async function run(push=true){
  const p = params();
  history.replaceState(null, "", "#"+p.toString());
  const q = Object.fromEntries(p);
  const key = JSON.stringify({...q, page:0, sort:0, kind});
  if (!current || key !== lastQ){
    out.innerHTML = `<div class="bar"><h2>${t("searching")}</h2></div><div class="list">${'<div class="skel"></div>'.repeat(4)}</div>`;
    try{
      const t0 = performance.now();
      current = kind === "free" ? await engine.searchFree(q.q) : await engine.search(q);
      current.kind = kind;
      current.ms = Math.round(performance.now()-t0);
      lastQ = key;
    }catch(e){ current = null; out.innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; return; }
  }
  current.results.sort(SORTERS[sort] || SORTERS.relevance);
  render(current);
}

function nameHTML(s, hit){
  const full = [s.first, s.middle].filter(Boolean).join(" ");
  return `<span class="nm ${hit?"hit":""}"><span class="ln">${esc(s.last||"—")}</span>${full?`, <span class="fn">${esc(full)}</span>`:""}</span>`;
}

const SLOTS = ["a_last", "a_first", "b_last", "b_first"];
function variantsHTML(d){
  const v = d.variants || {};
  if (d.kind === "free") {
    const rows = Object.values(v).filter(t => t.list && t.list.length);
    if (!rows.length) return "";
    return `<div class="vars">${Object.entries(v).filter(([, tk]) => tk.list && tk.list.length).map(([g, tk]) => `<div class="vrow"><span class="lbl">${esc(t("spellTok", {t: tk.tok}))}</span>${
      tk.list.map(x => `<button class="vchip ${x.d > 0.6 ? "far" : ""} ${filters.get(g)?.has(x.n) ? "on" : ""}" data-g="${g}" data-fn="${esc(x.n)}" title="${t(x.part === "last" ? "chip.last" : x.part === "first" ? "chip.first" : "chip.both")}">${esc(x.n)}<i>${fmt(x.cnt)}</i></button>`).join("")}</div>`).join("")}
      <div class="vnote">${t("vnote.free")}</div></div>`;
  }
  const slots = SLOTS.filter(k => v[k] && v[k].length);
  if (!slots.length) return "";
  return `<div class="vars">${slots.map(k => `<div class="vrow"><span class="lbl">${t("slot")[k]} ${t("spellings")}</span>${
    v[k].slice(0, 14).map(x => `<button class="vchip ${x.d > 0.6 ? "far" : ""} ${filters.get(k)?.has(x.n) ? "on" : ""}" data-g="${k}" data-fn="${esc(x.n)}">${esc(x.n)}<i>${fmt(x.cnt)}</i></button>`).join("")
  }${v[k].length > 14 ? `<span class="vnote">${t("moreN", {n: v[k].length - 14})}</span>` : ""}</div>`).join("")}
  <div class="vnote">${t("vnote.free")}</div></div>`;
}

const rowHas = (r, n) => [r.s1, r.s2].some(s => s.ln === n || s.fn === n || s.mids.includes(n) || s.lws.includes(n));
/** בין קבוצות: וגם. בתוך קבוצה: או */
const passFilters = r => [...filters.values()].every(set => [...set].some(n => rowHas(r, n)));
function toggleFilter(group, n){
  if (!filters.has(group)) filters.set(group, new Set());
  const set = filters.get(group);
  set.has(n) ? set.delete(n) : set.add(n);
  if (!set.size) filters.delete(group);
  page = 1; render(current);
}

function parsedHTML(d){
  if (d.kind !== "free" || !d.parsed) return "";
  const P = d.parsed, parts = [];
  P.persons.forEach((p, i) => parts.push(`<b>${P.persons.length > 1 ? (i ? t("spouse2") : t("spouse1")) : t("names")} <span dir="auto">${esc(p.join(" "))}</span></b>`));
  if (P.year_from) parts.push(`<b dir="ltr">${P.year_from === P.year_to ? P.year_from : P.year_from + "–" + P.year_to}</b>`);
  P.boroughs.forEach(b => parts.push(`<b>${esc(boroName(b))}</b>`));
  if (P.license) parts.push(`<b dir="ltr">License #${esc(P.license)}</b>`);
  return `<div class="parsed">${t("parsed")} ${parts.join("")}</div>`;
}

function render(d){
  const all = d.results;
  all.forEach((r, i) => r._i = i);
  const view = filters.size ? all.filter(passFilters) : all;
  const total = view.length;
  if (!total){
    out.innerHTML = `${parsedHTML(d)}${variantsHTML(d)}<div class="empty"><div class="big">${t("empty.big")}</div>${t("empty.p")}</div>`;
    bindVariants(); return;
  }
  const pages = Math.ceil(total/PAGE);
  if (page > pages) page = pages;
  const slice = view.slice((page-1)*PAGE, page*PAGE);
  out.innerHTML = `
    <div class="bar">
      <h2>${t("results")}</h2><span class="count">${total === 1 ? t("record1") : t("records", {n: fmt(total)})} · <span dir="ltr">${d.ms} ${t("ms")}</span></span>
      <span class="sp"></span>
      <select id="sort">
        <option value="relevance">${t("sort.rel")}</option><option value="year">${t("sort.year")}</option>
        <option value="year_desc">${t("sort.yeard")}</option><option value="name">${t("sort.name")}</option>
      </select>
      <button class="btn ghost" id="csv">⬇ CSV</button>
    </div>
    ${parsedHTML(d)}
    ${d.truncated ? `<div class="notice">${t("trunc")}</div>` : ""}
    ${filters.size ? `<div class="parsed">${t("filtered")} ${[...filters.entries()].map(([g, set], gi) =>
        (gi ? `<span class="fand">+</span>` : "") + `<span class="fgroup">${[...set].map(n => `<span class="ffilter">${esc(n)}<button data-rmg="${esc(g)}" data-rmn="${esc(n)}" title="${t("clear")}">✕</button></span>`).join(`<span class="for">/</span>`)}</span>`).join("")}
        ${[...filters.values()].reduce((a, s) => a + s.size, 0) > 1 ? `<button class="linkbtn" id="clrAll" style="margin:0 8px">${t("clearAll")}</button>` : ""}</div>` : ""}
    ${variantsHTML(d)}
    <div class="list">${slice.map((r,i)=>`
      <article class="rec" data-i="${r._i}">
        <div class="yr">${esc(r.year||"?")}${r.date?`<small title="${t("married")}">${esc(r.date)}</small>`:""}</div>
        <div>
          <div class="couple">${nameHTML(r.s1, (r.hl||[]).includes("s1"))}<span class="heart">♥</span>${nameHTML(r.s2, (r.hl||[]).includes("s2"))}</div>
          <div class="metaline">
            ${r.borough?`<span class="tag boro">${esc(boroName(r.borough))}</span>`:""}
            ${r.license?`<span class="tag lic">License #${esc(r.license)}</span>`:""}
          </div>
        </div>
        <div class="acts">
          <button class="icon" data-copy title="${t("copy")}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
        </div>
      </article>`).join("")}
    </div>
    ${pages>1?pager(page,pages):""}`;
  $("#sort").value = sort;
  $("#sort").onchange = e => { sort = e.target.value; page = 1; run(); };
  $("#csv").onclick = () => exportCSV(view);
  out.querySelectorAll("[data-rmg]").forEach(b => b.onclick = () => toggleFilter(b.dataset.rmg, b.dataset.rmn));
  const ca = $("#clrAll"); if (ca) ca.onclick = () => { filters.clear(); page = 1; render(d); };
  out.querySelectorAll(".pager button[data-p]").forEach(b=>b.onclick=()=>{page=+b.dataset.p;run();window.scrollTo({top:out.offsetTop-20,behavior:"smooth"})});
  bindVariants();
  out.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const r = d.results[+b.closest(".rec").dataset.i];
    const n = s => [s.first,s.middle,s.last].filter(Boolean).join(" ");
    const txt = `NYC Marriage License — ${n(r.s1)} & ${n(r.s2)} — ${r.borough||""} ${r.year||""}${r.date?" (married "+r.date+")":""} — License #${r.license||"?"} — Source: NYC Marriage Index, Reclaim The Records`;
    navigator.clipboard.writeText(txt).then(()=>toast(t("copied")));
  });
}

function bindVariants(){
  out.querySelectorAll(".vchip[data-fn]").forEach(b => b.onclick = () => toggleFilter(b.dataset.g, b.dataset.fn));
}

function exportCSV(rows){
  const h = t("csv");
  const q = v => `"${(v??"").toString().replace(/"/g,'""')}"`;
  const lines = [h.map(q).join(",")].concat(rows.map(r => [r.year,r.date,r.borough,r.license,r.s1.first,r.s1.middle,r.s1.last,r.s2.first,r.s2.middle,r.s2.last].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"}));
  a.download = "nyc_marriage_results.csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function pager(cur, n){
  const nums = new Set([1, n, cur-1, cur, cur+1, cur-2, cur+2].filter(x=>x>=1&&x<=n));
  const arr = [...nums].sort((a,b)=>a-b); let html = `<button data-p="${cur-1}" ${cur<=1?"disabled":""}>${document.documentElement.dir==="rtl"?"›":"‹"}</button>`, prev=0;
  for (const x of arr){ if (x-prev>1) html += `<button disabled>…</button>`; html += `<button data-p="${x}" class="${x===cur?"on":""}">${x}</button>`; prev=x; }
  return `<div class="pager">${html}<button data-p="${cur+1}" ${cur>=n?"disabled":""}>${document.documentElement.dir==="rtl"?"‹":"›"}</button></div>`;
}

loadMeta();
</script>
</body>
</html>
